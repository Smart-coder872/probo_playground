environment:
  width: 10 # meters
  height: 10 # meters
  runtime: 100 # seconds
  timestep: 0.1 # seconds
  robot_start: [0.0, 0.0, 0.6] # x, y, theta
  pinger_range: 3.0 # meters
  landmarks:
  - [2.0, 2.0] # x, y
  - [5.0, 5.0]
  - [8.0, 8.0]
  obstacles:
  - [5, 7, 5, 7] # x_min, x_max, y_min, y_max
  - [0, 4, 6, 8]
  field:
    variance: 0.1
    lengthscale: 3.0
    random_seed: 8

robot:
  MotorCommands:
    linear_noise: 0.03 # m/s
    angular_noise: 0.05 # rad/s

sensors:
  GPS:
    interval: 2.0
    x_noise: 0.5 # meters
    y_noise: 0.5 # meters
  LandmarkPinger:
    interval: 0.5
    bearing_noise_const: 0.08 # radians
    bearing_noise_prop: 0.0
    range_noise_const: 0.1 # meters
    range_noise_prop: 0.05
  Odometry:
    interval: 0.1
    linear_noise_const: 0.05 # m/s
    linear_noise_prop: 0.01 # m/s
    angular_noise_const: 0.1
    angular_noise_prop: 0.1
  InsituInstrument:
    interval: 0.5
    noise: 0.01  # measurement units

action:
  action_step: 5.0  # duration of an action
  num_actions: 10 # discretization of the action space
  vel1_range: [0.7, 0.75]  # m/s linear velocity
  vel2_range: [-0.5, 0.5]  # rad/s angular velocity

reward:
  name: "ucb"
  alpha: 9.0